<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <title>B-log Tracker</title>
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <link rel="stylesheet" href="style.css" />
</head>
<body>

<!-- LOGIN -->
<div id="loginBox" class="card center">
  <h2>Login</h2>
  <input id="email" type="email" placeholder="Email" />
  <input id="password" type="password" placeholder="Password" />
  <button onclick="login()">Login</button>
  <p id="loginError"></p>
</div>

<!-- APP -->
<div id="app" class="hidden">
  <header class="topbar">
    <div>B-log Tracker</div>
    <button onclick="logout()">Logout</button>
  </header>

  <div class="container">
    <div class="card">
      <h2>Actions</h2>
      <div class="buttons">
        <button class="check-in" onclick="logAction('Check In')">Check In</button>
        <button class="check-out" onclick="logAction('Check Out')">Check Out</button>
      </div>
      <p id="message"></p>
    </div>

    <div class="card">
      <h2>Attendance Log</h2>
      <div id="logList"></div>
    </div>
  </div>
</div>

<!-- Firebase SDKs -->
<script src="https://www.gstatic.com/firebasejs/10.12.0/firebase-app-compat.js"></script>
<script src="https://www.gstatic.com/firebasejs/10.12.0/firebase-auth-compat.js"></script>
<script src="https://www.gstatic.com/firebasejs/10.12.0/firebase-firestore-compat.js"></script>

<script src="firebase.js"></script>
<script src="script.js"></script>
</body>
</html>
