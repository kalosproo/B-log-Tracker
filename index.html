<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <title>B-log Tracker</title>
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <link rel="stylesheet" href="style.css" />
</head>
<body>

<header class="topbar">
  <div class="brand">B-log Tracker</div>
  <div class="status">● Camera Ready</div>
</header>

<div class="container">

  <section class="card">
    <h2>Actions</h2>
    <p class="hint">Click check in or out. Camera will capture proof.</p>

    <video id="video"playsinline></video>

    <div class="buttons">
      <button class="check-in" onclick="startCamera('Check In')">Check In</button>
      <button class="check-out" onclick="startCamera('Check Out')">Check Out</button>
    </div>

    <div id="message"></div>
  </section>

  <section class="card">
    <div class="log-header">
      <h2>Attendance Log</h2>
    </div>
    <div id="logList"></div>
  </section>

</div>

<canvas id="canvas"></canvas>

<!-- Firebase SDKs -->
<script src="https://www.gstatic.com/firebasejs/10.12.0/firebase-app-compat.js"></script>
<script src="https://www.gstatic.com/firebasejs/10.12.0/firebase-firestore-compat.js"></script>

<script src="firebase.js"></script>
<script src="script.js"></script>
</body>
</html>
