<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <title>B-log Tracker</title>
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <link rel="stylesheet" href="style.css" />
</head>
<body>

<div class="auth-container" id="authBox">
  <h1>B-log Tracker</h1>
  <p class="sub">Track your daily work cleanly</p>

  <input id="email" type="email" placeholder="Email" />
  <input id="password" type="password" placeholder="Password" />

  <button class="primary" onclick="login()">Login</button>
  <button onclick="signup()">Create Account</button>

  <div class="divider">OR</div>

  <button class="google" onclick="googleLogin()">Continue with Google</button>

  <p id="authError"></p>
</div>

<div id="app" class="hidden">
  <header class="topbar">
    <div>B-log Tracker</div>
    <button onclick="logout()">Logout</button>
  </header>

  <main class="container">
    <section class="card">
      <h2>Actions</h2>
      <div class="buttons">
        <button class="check-in" onclick="logAction('Check In')">Check In</button>
        <button class="check-out" onclick="logAction('Check Out')">Check Out</button>
      </div>
      <p id="message"></p>
    </section>

    <section class="card">
      <h2>Attendance Log</h2>
      <div id="logList"></div>
    </section>
  </main>
</div>

<script src="https://www.gstatic.com/firebasejs/10.12.0/firebase-app-compat.js"></script>
<script src="https://www.gstatic.com/firebasejs/10.12.0/firebase-auth-compat.js"></script>
<script src="https://www.gstatic.com/firebasejs/10.12.0/firebase-firestore-compat.js"></script>

<script src="firebase.js"></script>
<script src="script.js"></script>
</body>
</html>
