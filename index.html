 <!DOCTYPE html> 
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <title>B-log Tracker</title>
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <link rel="stylesheet" href="style.css" />
</head>
<body>

<div class="auth-container" id="authBox">

  <!-- BRAND -->
  <h1>B-log Tracker</h1>
  <p class="sub">Track your daily work cleanly</p>

  <!-- TABS -->
  <div class="auth-tabs">
    <button id="tab-login" class="active" onclick="showLogin()">Sign In</button>
    <button id="tab-signup" onclick="showSignup()">Sign Up</button>
  </div>

  <!-- LOGIN FORM -->
  <div id="login-form">
<input id="email" type="email" placeholder="Email">
<input id="password" type="password" placeholder="Password">


    <button class="primary" onclick="login()">Sign In</button>
  </div>

  <!-- SIGNUP FORM -->
  <div id="signup-form" class="hidden">
  <input id="signupEmail" type="email" placeholder="Email">
<input id="signupPassword" type="password" placeholder="Password">

    <button class="primary" onclick="signup()">Create Account</button>
  </div>

  <div class="divider">OR</div>

  <button class="google" onclick="googleLogin()">
    Continue with Google
  </button>

  <p id="authError"></p>
</div>

<div id="app" class="hidden">
  <header class="topbar">
    <div>B-log Tracker</div>
    <button onclick="logout()">Logout</button>
  </header>

  <main class="container">
   <!-- CURRENT STATUS -->
<section class="card status-card">
  <h2>Current Status</h2>

  <div class="status-row">
    <span class="status-dot offline" id="statusDot"></span>
    <span id="statusText">Offline</span>
  </div>

  <div class="timer" id="liveTimer">00:00:00</div>
  <div class="started-at" id="startedAt">Not working</div>
</section>

    <section class="card">
      <h2>Actions</h2>
      <div class="buttons">
     <button id="checkInBtn" class="check-in" onclick="logAction('Check In')">
  Check In
</button>

<button id="checkOutBtn" class="check-out" onclick="logAction('Check Out')">
  Check Out
</button>

      </div>
      <p id="message"></p>
    </section>

    <section class="card">
      <h2>Attendance Log</h2>
      <div id="logList"></div>
    </section>
  </main>
</div>

<script src="https://www.gstatic.com/firebasejs/10.12.0/firebase-app-compat.js"></script>
<script src="https://www.gstatic.com/firebasejs/10.12.0/firebase-auth-compat.js"></script>
<script src="https://www.gstatic.com/firebasejs/10.12.0/firebase-firestore-compat.js"></script>

<script src="firebase.js"></script>
<script src="script.js"></script>
</body>
</html>
